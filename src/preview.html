<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. The host owns the theme, so there is
     * no second copy to drift.
     */
    --bg: var(--mp-surface-solid, #f3ece1);
    --solid: var(--mp-surface-solid, #f3ece1);
    --ink: var(--mp-ink, #2f261e);
    --muted: var(--mp-ink-soft, #8b7c6a);
    --line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --accent: var(--mp-accent, #a65d2e);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    /* A changed line wears its own side's colour, and a changed word wears a
       stronger wash of the same one: the two never borrow the accent, so the
       red/green reading of a diff survives any theme. */
    --added: color-mix(in srgb, var(--mp-success, #607d4c) 24%, transparent);
    --removed: color-mix(in srgb, var(--mp-danger, #b65b36) 22%, transparent);
    --added-mark: color-mix(in srgb, var(--mp-success, #607d4c) 44%, transparent);
    --removed-mark: color-mix(in srgb, var(--mp-danger, #b65b36) 40%, transparent);
    --added-ink: var(--mp-success-ink, #4a6638);
    --removed-ink: var(--mp-danger-ink, #9f4629);
    --mark: color-mix(in srgb, var(--mp-accent, #a65d2e) 28%, transparent);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    /* One line box for every piece of the document — the highlighted rows,
       the editor and its gutter — so they can never drift apart. */
    --code-line: 20.625px;
    /* The page's scrollbar, reserved beside both panes and the header. */
    --scrollbar: 8px;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --solid: var(--mp-surface-solid, #171412);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --added: color-mix(in srgb, var(--mp-success, #93b277) 30%, transparent);
    --removed: color-mix(in srgb, var(--mp-danger, #d58a68) 26%, transparent);
    --added-mark: color-mix(in srgb, var(--mp-success, #93b277) 50%, transparent);
    --removed-mark: color-mix(in srgb, var(--mp-danger, #d58a68) 46%, transparent);
    --added-ink: var(--mp-success-ink, #b2cc96);
    --removed-ink: var(--mp-danger-ink, #e4a484);
    --mark: color-mix(in srgb, var(--mp-accent, #e2955f) 34%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }

  /*
   * The page is one sheet: one header, then the comparison, then the status
   * line, with no card floating inside the page. The chrome is the sheet — the
   * head, the pane labels and the status line carry no fill of their own, so a
   * hairline is the only thing that marks where they end. A raised ground here
   * would put a bright plate across the top and bottom of every comparison.
   *
   * The head names the entry at the left and keeps the page's actions at the
   * right, all of them 28px high so the row has a single size (D-1051).
   * Closing is set apart by a hairline and is the only control the page does
   * not tint.
   */
  .doc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 46px;
    padding: 0 14px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .doc-id {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .doc-icon { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .doc-title {
    min-width: 0;
    max-width: 40vw;
    overflow: hidden;
    font: 600 13px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-actions { display: flex; align-items: center; gap: 4px; min-width: 0; }
  /* The format label is information, not a control: no box, no hover state. */
  .badge {
    display: inline-flex;
    align-items: center;
    height: 28px;
    margin-right: 6px;
    padding: 0 2px;
    color: var(--muted);
    font: 11.5px/1 var(--mono);
    white-space: nowrap;
  }
  .doc-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-action .icon { width: 15px; height: 15px; }
  .doc-action:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    color: var(--ink);
  }
  .doc-action:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .doc-action:disabled { opacity: 0.4; cursor: default; }
  .doc-action[data-action="save"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .doc-action[data-action="save"]:hover:not(:disabled) {
    background: var(--accent);
    color: var(--accent-ink);
    filter: brightness(1.08);
  }
  .doc-sep { width: 1px; height: 16px; flex: none; margin: 0 4px; background: var(--line); }
  .doc-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-close .icon { width: 14px; height: 14px; }
  .doc-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .doc-close:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  /*
   * The two slim labels that keep the columns named. They sit on the sheet,
   * not on a band of their own: the hairline below them is the only mark.
   */
  .pane-heads {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    /* The scroller's bar takes width from the panes; syncPaneGutter measures it
       onto --pane-gutter so the two halves meet on the same vertical line. */
    padding-right: var(--pane-gutter, 0px);
    border-bottom: 1px solid var(--line);
  }
  .pane-head {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
    padding: 4px 8px 4px 16px;
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    cursor: text;
  }
  .pane-head:last-child { border-left: 1px solid var(--line); }
  .pane-head strong {
    overflow: hidden;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    text-overflow: ellipsis;
  }

  .scroller {
    min-height: 0;
    overflow: auto;
    /* The bar's width is always reserved, so the divider never shifts when a
       short document grows past the viewport. */
    scrollbar-gutter: stable;
    /* The rows are the page's own body, so they take the sheet's ground
       rather than a raised plate of their own. */
    position: relative;
    background: var(--solid);
  }
  /* A click anywhere in a pane opens its editor, not only on the text. */
  .scroller { cursor: text; }
  /*
   * Scrollbars follow the host: a thin bar with no track and a capsule thumb,
   * the same geometry MyPaste's own overlay uses. The page keeps a single
   * scrollbar in both modes, so this is the only scroller on the surface.
   */
  ::-webkit-scrollbar { width: var(--scrollbar); height: var(--scrollbar); }
  ::-webkit-scrollbar-track,
  ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--ink) 26%, transparent);
    background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: color-mix(in srgb, var(--ink) 40%, transparent);
  }
  .rows {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-content: start;
    /* The divider belongs to the document, not to a cell: it runs from the
       header to the foot whether or not a row has lines on both sides, and it
       never moves when the page switches between reading and editing. */
    position: relative;
    min-height: 100%;
  }
  .rows::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--line);
    z-index: 1;
    pointer-events: none;
  }
  .diff-row { display: contents; }
  .line {
    display: flex;
    gap: 10px;
    padding: 0 10px;
    color: var(--ink);
    font: 12.5px var(--mono);
    line-height: var(--code-line);
    tab-size: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .line-number {
    position: relative;
    z-index: 2;
    flex: none;
    width: 24px;
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    user-select: none;
  }
  /* Above the divider, so a rule never crosses a glyph. */
  .line-text { position: relative; z-index: 2; flex: 1; min-width: 0; }
  .diff-row[data-kind="delete"] .line.before { background: var(--removed); }
  .diff-row[data-kind="insert"] .line.after { background: var(--added); }
  .diff-row[data-kind="change"] .line.before { background: var(--removed); }
  .diff-row[data-kind="change"] .line.after { background: var(--added); }
  /* A changed word wears the stronger wash of its own side and that side's
     ink: a deletion never borrows the accent's warm orange, and the text is
     coloured like the band under it. No padding, so the word occupies exactly
     the width it will have in the editor that replaces this column. */
  .line.before .diff-mark { background: var(--removed-mark); color: var(--removed-ink); }
  .line.after .diff-mark { background: var(--added-mark); color: var(--added-ink); }
  /*
   * The standalone page starts with nothing to compare: each column offers its
   * own prompt, a button that opens that side's editor. The pair sits on the
   * same two columns as the rows, so the page already has the shape of the
   * comparison before it holds one word.
   */
  .empty-state {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    /* Only the prompts take clicks: the rest of the overlay stays transparent
       to the pointer, so the editor underneath keeps the caret and the
       scroller keeps its scrollbar. */
    pointer-events: none;
  }
  /* The same divider the rows draw, so the prompts line up with the columns
     that will replace them. */
  .empty-state::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--line);
  }
  .empty-state[hidden] { display: none; }
  /* The side being edited keeps its cell but not its prompt: the editor under
     it takes the click, and the other prompt still switches sides. */
  .empty-state[data-editing="before"] [data-side="before"],
  .empty-state[data-editing="after"] [data-side="after"] { visibility: hidden; }
  /* The prompt is the label block, not the whole column: a focus ring around
     the column would read as a card laid over the page, and the column itself
     stays clickable through the overlay anyway. */
  .empty-side {
    display: grid;
    justify-items: center;
    gap: 4px;
    place-self: center;
    max-width: calc(100% - 32px);
    padding: 14px 24px;
    border: 0;
    background: transparent;
    color: var(--muted);
    text-align: center;
    font: inherit;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: auto;
  }
  .empty-side:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .empty-side:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .empty-title { color: var(--ink); font-size: 13px; font-weight: 600; }
  .empty-note { max-width: 22em; text-wrap: balance; }

  /*
   * Edit mode (one click on either side). The clicked side keeps the page's
   * own layout: the same column of the same two-pane row, the same numbers,
   * the same padding and the same monospace rhythm, with a transparent
   * textarea laid over the rows that were already painted. Nothing moves,
   * nothing gets a background of its own, and the page keeps its one
   * scrollbar. The column that stays read-only keeps the exact rows it had,
   * so its colours are the ones painted on load.
   */
  /* The same two equal columns as the read-only grid: the editor's own padding
     must not widen its half, or the editor would sit 10px off the divider. */
  .rows.editing {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: start;
  }
  .edit-side {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
    padding: 0 10px;
  }
  /*
   * The side being edited keeps the comparison's colours. Its own rows are
   * painted once, underneath the transparent textarea: the bands and word
   * washes are the ones already on screen, so a click changes nothing about
   * them, and the editor's own text sits on the same line boxes.
   */
  .edit-shade {
    position: absolute;
    /* The pane's padding box is the whole column, so a band spans the pane
       exactly as the read-only row's did; the rows inside bring their own
       gutter and padding back. */
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .edit-shade .line { color: transparent; }
  /* One more class than the side rules above, so the wash keeps its colour and
     the glyphs under the editor stay invisible. */
  .edit-shade .line .diff-mark { color: transparent; }
  /*
   * The number column's width and nothing else: the shade's own rows draw the
   * digits, so a wrapped line keeps one number beside its first line instead
   * of pushing every number below it out of step with the text.
   */
  .edit-gutter {
    position: relative;
    z-index: 2;
    flex: none;
    width: 24px;
  }
  .edit-input {
    position: relative;
    z-index: 2;
    flex: 1;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--ink);
    font: 12.5px var(--mono);
    line-height: var(--code-line);
    resize: none;
    overflow: hidden;
    tab-size: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .edit-input::selection { background: var(--mark); }
  .diff-column { flex: 1 1 0; min-width: 0; }

  /*
   * The status bar mirrors the code editor's footer: the comparison's own
   * state on the left, its size on the right.
   */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 26px;
    padding: 4px 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font: 11px/1.4 var(--mono);
  }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: auto;
    white-space: nowrap;
  }
  #diff-stats {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #diff-status {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #diff-status[data-tone="error"] { color: var(--mp-danger-ink, #b4472c); }
  #diff-status[hidden] { display: none; }

  /*
   * A menu page (host D-1234) has no entry behind it and no host tab to close:
   * the reader supplies both texts, and copying the right side is the record
   * it writes. Saving a new entry is the surface's own action, so it leaves
   * with the close control; the host owns the tab.
   */
  body[data-mode="menu"] [data-action="save"],
  body[data-mode="menu"] .doc-sep,
  body[data-mode="menu"] .doc-close { display: none; }

  /*
   * Corner system (host D-1099): one ladder, so every box answers with the
   * same family. A mark is 4px, a control 6px, a card or popover 10px, a
   * floating dialog 14px, and an indicator or scrollbar is a capsule.
   */
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  button {
    border-radius: var(--radius-sm);
  }
</style>
</head>
<body>
  <header class="doc-head">
    <div class="doc-id">
      <svg class="doc-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 2.5h6l3 3v8h-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <span class="doc-title" id="current-title">当前条目</span>
    </div>
    <div class="doc-actions">
      <span class="badge" id="diff-language"></span>
      <button type="button" class="doc-action" data-action="copy"
        title="复制当前文本" aria-label="复制当前文本">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" class="doc-action" data-action="save"
        title="保存为新条目" aria-label="保存为新条目">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M3 2.5h8l2 2v9h-10z"/>
            <path d="M5 2.5v4h6v-4"/>
            <path d="M5 13.5v-4h6v4"/>
          </g>
        </svg>
      </button>
      <span class="doc-sep" aria-hidden="true"></span>
      <button type="button" class="doc-close" id="doc-close" title="关闭" aria-label="关闭">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="pane-heads">
    <div class="pane-head before" data-side="before">对照 · <strong id="companion-title">—</strong></div>
    <div class="pane-head after" data-side="after">当前文本</div>
  </div>
  <div class="scroller" id="diff-scroller">
    <div class="rows" id="diff-rows"></div>
    <div class="empty-state" id="diff-empty" hidden>
      <button type="button" class="empty-side" data-side="before">
        <span class="empty-title">对比基准</span>
        <span class="empty-note">点这里输入或粘贴参照的文本</span>
      </button>
      <button type="button" class="empty-side" data-side="after">
        <span class="empty-title">当前文本</span>
        <span class="empty-note">点这里输入或粘贴要对照的文本</span>
      </button>
    </div>
  </div>
  <footer class="statusbar">
    <span id="diff-status" role="status" aria-live="polite" hidden></span>
    <div class="statusbar-right">
      <span id="diff-stats">等待宿主交付文本…</span>
    </div>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
